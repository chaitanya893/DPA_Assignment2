[project]
name = "fund-distribution-engine"
version = "2.0.0"
description = "Assignment 2: fund distribution detection (Layer A) and extraction (Layer B) engine"
requires-python = ">=3.11"

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]
